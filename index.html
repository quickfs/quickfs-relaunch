<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickFS</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
    html, body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
    }

    .card {
        border: 1px solid #d9d9d9;
        border-radius: 12px;
        padding: 48px 64px;
        background: #fff;
        box-shadow: 0 4px 18px rgba(0,0,0,0.05);
        max-width: 540px;
        text-align: center;
    }

    .logo {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto 36px;
    }

    h1 {
        margin: 0 0 14px;
        color: #222;
        font-size: 22px;
        font-weight: 600;
    }

    p {
        margin: 0;
        color: #555;
        font-size: 17px;
        line-height: 1.6;
    }

    a {
        color: #2675bd;
        font-weight: 600;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        .card {
            padding: 36px 28px;
        }
    }
</style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img class="logo" src="logo.png" alt="QuickFS">
            <h1>A note from the founder</h1>
            <p>
                I'm exploring bringing QuickFS back with all the same features,
                powered by a new financial data provider.
                <a href="mailto:tcooper@quickfs.net?subject=QuickFS%20relaunch%20feedback">I'd love to hear your thoughts.</a>
            </p>
        </div>
    </div>
</body>
</html>
