<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickFS</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
    html, body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
    }

    .card {
        border: 1px solid #d9d9d9;
        border-radius: 12px;
        padding: 48px 64px;
        background: #fff;
        box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    .logo {
        display: block;
        max-width: 420px;
        width: 100%;
        height: auto;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img class="logo" src="logo.png" alt="QuickFS">
        </div>
    </div>
</body>
</html>
